[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-harness-mcp"
version = "1.0.0"
description = "Browser Harness MCP — control your real browser + Gmail flow over MCP stdio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vaibhxvvy" }]
keywords = ["agent", "automation", "browser", "cdp", "chrome", "gmail", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "browser-harness",
  "mcp>=2.1.1",
  "pillow",
]

[project.scripts]
browser-harness-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/vaibhxvvy/browser-harness-mcp"
Repository = "https://github.com/vaibhxvvy/browser-harness-mcp"
Issues = "https://github.com/vaibhxvvy/browser-harness-mcp/issues"

[project.scripts]
browser-harness-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
